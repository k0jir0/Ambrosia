name: CI

# Branch strategy:
#   main     = production  → auto-deploys to Render production services
#   staging  = staging     → auto-deploys to Render staging services
#   feat/*   = feature dev → CI only, no Render deploy
#   fix/*    = hotfix dev  → CI only, no Render deploy
#   chore/*  = maintenance → CI only, no Render deploy

on:
  push:
    branches:
      - main
      - staging
      - "feat/**"
      - "fix/**"
      - "chore/**"
  pull_request:
    branches:
      - main
      - staging

jobs:
  # -------------------------------------------------------------------------
  # Gate 1: API contract tests + lint
  # Non-negotiable: all 8 core function suites must pass before merge.
  # -------------------------------------------------------------------------
  api-tests:
    name: API tests & lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Run lint (ruff)
        run: uv run ruff check app tests

      - name: Run tests with coverage gate
        run: uv run pytest --tb=short -q

  # -------------------------------------------------------------------------
  # Gate 2: Web build + lint
  # -------------------------------------------------------------------------
  web-build:
    name: Web build & lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Lint web
        run: pnpm lint:web

      - name: Build web
        run: pnpm build:web

  # -------------------------------------------------------------------------
  # Gate 3: Stack contract tests
  # Verifies that the API surface matches the contract the web layer expects.
  # -------------------------------------------------------------------------
  stack-contract:
    name: Stack contract tests
    runs-on: ubuntu-latest
    needs: [api-tests]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install root dependencies
        run: uv sync --project services/api

      - name: Run stack contract tests
        run: |
          cd services/api
          uv run pytest ../../tests/test_stack_contract.py --tb=short -q
        continue-on-error: true

  # -------------------------------------------------------------------------
  # Deploy to STAGING (branch: staging only)
  # Triggers after all gates pass. Uses Render deploy hooks stored as secrets.
  # -------------------------------------------------------------------------
  deploy-staging:
    name: Deploy → Staging
    runs-on: ubuntu-latest
    needs: [api-tests, web-build, stack-contract]
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'

    steps:
      - name: Trigger staging API deploy
        if: vars.RENDER_HOOK_STAGING_API != ''
        run: |
          curl -s -X POST "${{ vars.RENDER_HOOK_STAGING_API }}" \
            -H "Content-Type: application/json" \
            --fail-with-body
        continue-on-error: true

      - name: Trigger staging Web deploy
        if: vars.RENDER_HOOK_STAGING_WEB != ''
        run: |
          curl -s -X POST "${{ vars.RENDER_HOOK_STAGING_WEB }}" \
            -H "Content-Type: application/json" \
            --fail-with-body
        continue-on-error: true

      - name: Staging deploy triggered
        run: echo "Staging deploy hooks fired. Monitor at https://dashboard.render.com"

  # -------------------------------------------------------------------------
  # Deploy to PRODUCTION (branch: main only)
  # Only runs on main after all gates pass. Production deploys are gated by
  # the same CI suite + Render health checks before traffic cutover.
  # -------------------------------------------------------------------------
  deploy-production:
    name: Deploy → Production
    runs-on: ubuntu-latest
    needs: [api-tests, web-build, stack-contract]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger production API deploy
        if: vars.RENDER_HOOK_PROD_API != ''
        run: |
          curl -s -X POST "${{ vars.RENDER_HOOK_PROD_API }}" \
            -H "Content-Type: application/json" \
            --fail-with-body
        continue-on-error: true

      - name: Trigger production Web deploy
        if: vars.RENDER_HOOK_PROD_WEB != ''
        run: |
          curl -s -X POST "${{ vars.RENDER_HOOK_PROD_WEB }}" \
            -H "Content-Type: application/json" \
            --fail-with-body
        continue-on-error: true

      - name: Production deploy triggered
        run: echo "Production deploy hooks fired. Monitor at https://dashboard.render.com"
