name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  # -------------------------------------------------------------------------
  # Gate 1: API contract tests + lint
  # Non-negotiable: all 8 core function suites must pass before merge.
  # -------------------------------------------------------------------------
  api-tests:
    name: API tests & lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Run lint (ruff)
        run: uv run ruff check app tests

      - name: Run tests with coverage gate
        run: uv run pytest --tb=short -q

  # -------------------------------------------------------------------------
  # Gate 2: Web build + lint
  # -------------------------------------------------------------------------
  web-build:
    name: Web build & lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Lint web
        run: pnpm lint:web

      - name: Build web
        run: pnpm build:web

  # -------------------------------------------------------------------------
  # Gate 3: Stack contract tests
  # Verifies that the API surface matches the contract the web layer expects.
  # -------------------------------------------------------------------------
  stack-contract:
    name: Stack contract tests
    runs-on: ubuntu-latest
    needs: [api-tests]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install root dependencies
        run: uv sync --project services/api

      - name: Run stack contract tests
        run: |
          cd services/api
          uv run pytest ../../tests/test_stack_contract.py --tb=short -q
        continue-on-error: true
