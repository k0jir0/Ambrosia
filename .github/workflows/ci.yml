name: CI

# Branch strategy:
#   main     = production  → auto-deploys to Render production services
#   staging  = staging     → auto-deploys to Render staging services
#   feat/*   = feature dev → CI only, no Render deploy
#   fix/*    = hotfix dev  → CI only, no Render deploy
#   chore/*  = maintenance → CI only, no Render deploy

on:
  push:
    branches:
      - main
      - staging
      - "feat/**"
      - "fix/**"
      - "chore/**"
  pull_request:
    branches:
      - main
      - staging
  workflow_dispatch:

jobs:
  # -------------------------------------------------------------------------
  # Gate 1: API contract tests + lint
  # Non-negotiable: all 8 core function suites must pass before merge.
  # -------------------------------------------------------------------------
  api-tests:
    name: API tests & lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Run lint (ruff)
        run: uv run ruff check app tests

      - name: Run tests with coverage gate
        run: uv run pytest --tb=short -q

  # -------------------------------------------------------------------------
  # Gate 2: Web build + lint
  # -------------------------------------------------------------------------
  web-build:
    name: Web build & lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Lint web
        run: pnpm lint:web

      - name: Build web
        run: pnpm build:web

  # -------------------------------------------------------------------------
  # Gate 2a: Mobile contract + Expo config
  # Ensures the React Native surface stays aligned with FastAPI routes.
  # -------------------------------------------------------------------------
  mobile-contract:
    name: Mobile contract & config
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Typecheck mobile
        run: pnpm typecheck:mobile

      - name: Test mobile
        run: pnpm test:mobile

      - name: Validate Expo public config
        run: pnpm --filter @ambrosia/mobile exec expo config --type public

      - name: Generate mobile contract types
        run: pnpm mobile:types:generate

      - name: Verify mobile API contract
        run: python scripts/verify-mobile-contracts.py --check

      - name: Verify mobile deployment readiness
        run: pnpm mobile:deployment:check

  # -------------------------------------------------------------------------
  # Gate 3: Stack contract tests
  # Verifies that the API surface matches the contract the web layer expects.
  # -------------------------------------------------------------------------
  stack-contract:
    name: Stack contract tests
    runs-on: ubuntu-latest
    needs: [api-tests]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install root dependencies
        run: uv sync --project services/api

      - name: Run stack contract tests
        run: |
          cd services/api
          uv run pytest ../../tests/test_stack_contract.py --tb=short -q
        continue-on-error: true

  # -------------------------------------------------------------------------
  # Gate 4: Function registry + frontend visibility matrix
  # Ensures all non-internal backend functions are mapped to frontend surfaces.
  # -------------------------------------------------------------------------
  visibility-proof:
    name: Visibility proof gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify function registry and visibility matrix
        run: python scripts/verify-visibility-matrix.py

  # -------------------------------------------------------------------------
  # Gate 4a: Hot-path design boundary verification
  # Ensures deterministic low-latency service boundary stays separate from API/LLM paths.
  # -------------------------------------------------------------------------
  hotpath-design:
    name: Hot-path design verification
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify hot-path service design scaffold
        run: python scripts/verify-hotpath-design.py

      - name: Verify Phase 7 hot-path governance gate
        run: python scripts/verify-hotpath-phase7.py

  # -------------------------------------------------------------------------
  # Gate 4b: Index84 route inventory + exposure-filtered OpenAPI
  # Ensures route classification and public/internal contract artifacts do not drift.
  # -------------------------------------------------------------------------
  index84-route-contract:
    name: Index84 route contract artifacts
    runs-on: ubuntu-latest
    needs: [api-tests]
    defaults:
      run:
        working-directory: services/api

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Generate Index84 route inventory artifact
        run: uv run python ../../scripts/generate-index84-route-inventory.py --write

      - name: Verify Index84 route inventory
        run: uv run python ../../scripts/generate-index84-route-inventory.py --check

      - name: Generate exposure-filtered OpenAPI artifacts
        run: uv run python ../../scripts/generate-index84-route-inventory.py --write-openapi

      - name: Verify exposure-filtered OpenAPI artifacts
        run: uv run python ../../scripts/generate-index84-route-inventory.py --check-openapi

      - name: Upload Index84 route artifacts
        uses: actions/upload-artifact@v4
        with:
          name: index84-route-contract
          path: |
            artifacts/index84-route-inventory.json
            artifacts/openapi/*.json
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # Gate 4c: Index84 SDK/CLI safe-read skeleton
  # Ensures API automation surfaces remain importable and machine-readable.
  # -------------------------------------------------------------------------
  index84-sdk-cli:
    name: Index84 SDK and CLI smoke
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify SDK and CLI skeleton
        run: python scripts/verify-sdk-cli.py

      - name: Upload SDK/CLI transcript
        uses: actions/upload-artifact@v4
        with:
          name: index84-sdk-cli-transcript
          path: artifacts/sdk-cli-transcript.json
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # Gate 4d: Index84 schemas + benchmark relay fixtures
  # Proves alpha/paper schemas and benchmark traces remain machine-verifiable.
  # -------------------------------------------------------------------------
  index84-schemas-benchmark:
    name: Index84 schemas and benchmark relays
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run FinanceBench relay fixture
        run: python packages/evals/run_financebench_relay.py

      - name: Run FinQA relay fixture
        run: python packages/evals/run_finqa_relay.py

      - name: Run TAT-QA relay fixture
        run: python packages/evals/run_tatqa_relay.py

      - name: Generate Open FinLLM routing map
        run: python scripts/generate-open-finllm-routing-map.py

      - name: Verify Index84 schemas
        run: python scripts/verify-index84-schemas.py

      - name: Verify Index85 benchmark coverage
        run: python scripts/verify-index85-benchmarks.py

      - name: Run decision memory fixture
        run: python packages/evals/run_decision_memory_fixture.py

      - name: Run alpha decay fixture
        run: python packages/evals/run_alpha_decay_fixture.py

      - name: Verify enterprise execution fixture
        run: python scripts/verify-enterprise-execution.py

      - name: Upload Index84 benchmark trace
        uses: actions/upload-artifact@v4
        with:
          name: index84-financebench-relay-trace
          path: |
            artifacts/financebench-relay-trace.json
            artifacts/finqa-relay-trace.json
            artifacts/tatqa-relay-trace.json
            artifacts/open-finllm-routing-map.json
            artifacts/decision-memory-attribution.json
            artifacts/alpha-decay-alerts.json
            artifacts/enterprise-execution-readiness.json
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # Gate 4g: Release distribution and provenance readiness
  # Produces checksums/release evidence and verifies Docker + provenance policy.
  # -------------------------------------------------------------------------
  index85-release-readiness:
    name: Index85 release readiness
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate release evidence
        run: python scripts/generate-release-evidence.py

      - name: Verify release readiness
        run: python scripts/verify-release-readiness.py

      - name: Upload release readiness artifacts
        uses: actions/upload-artifact@v4
        with:
          name: index85-release-readiness
          path: |
            artifacts/release-checksums.sha256
            artifacts/release-evidence.json
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # Gate 4h: Documentation consistency gate
  # Ensures CLI/SDK docs and evidence matrix reflect implemented surfaces.
  # -------------------------------------------------------------------------
  index85-docs-consistency:
    name: Index85 documentation consistency
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify docs consistency
        run: python scripts/verify-docs-consistency.py

  # -------------------------------------------------------------------------
  # Gate 4e: Index84 web control-plane evidence
  # Ensures the roadmap frontend matrix maps to implemented routes and tests.
  # -------------------------------------------------------------------------
  index84-web-control-plane:
    name: Index84 web control-plane evidence
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify web control-plane matrix
        run: python scripts/verify-web-control-plane.py

      - name: Generate frontend quality evidence
        run: python scripts/generate-frontend-quality-evidence.py

      - name: Upload web control-plane evidence
        uses: actions/upload-artifact@v4
        with:
          name: index84-web-control-plane-evidence
          path: artifacts/web-control-plane-evidence.json
          if-no-files-found: error

      - name: Upload frontend quality evidence
        uses: actions/upload-artifact@v4
        with:
          name: index86-frontend-quality-evidence
          path: artifacts/frontend-quality-evidence.json
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # Gate 4f: Index84 completion evidence
  # Verifies every roadmap plan maps to evidence before reporting 100%.
  # -------------------------------------------------------------------------
  index84-completion:
    name: Index84 completion evidence
    runs-on: ubuntu-latest
    needs: [index84-route-contract, index84-sdk-cli, index84-schemas-benchmark, index84-web-control-plane, index85-release-readiness, index85-docs-consistency, migration-check]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install API dependencies
        run: |
          cd services/api
          uv sync

      - name: Regenerate Index84 evidence artifacts
        run: |
          cd services/api
          uv run python ../../scripts/generate-index84-route-inventory.py --write --write-openapi
          cd ../..
          python scripts/verify-sdk-cli.py
          python packages/evals/run_financebench_relay.py
          python packages/evals/run_finqa_relay.py
          python packages/evals/run_tatqa_relay.py
          python scripts/generate-open-finllm-routing-map.py
          python packages/evals/run_decision_memory_fixture.py
          python scripts/verify-enterprise-execution.py
          python scripts/generate-release-evidence.py
          python scripts/verify-web-control-plane.py
          python scripts/generate-frontend-quality-evidence.py
          python scripts/verify-index84-schemas.py
          python scripts/verify-index85-benchmarks.py
          python packages/evals/run_alpha_decay_fixture.py
          python scripts/verify-release-readiness.py
          python scripts/verify-production-evidence.py
          python scripts/verify-docs-consistency.py
          python scripts/verify-hotpath-design.py
          python scripts/verify-hotpath-phase7.py
          cd services/api
          uv run python ../../scripts/verify-index84-literal.py
          cd ../..
          python scripts/verify-index84-completion.py
          python scripts/verify-index86-closure.py

      - name: Verify Index84 completion
        run: python scripts/verify-index84-completion.py

      - name: Upload Index84 completion packet
        uses: actions/upload-artifact@v4
        with:
          name: index84-completion-packet
          path: |
            artifacts/index84-completion.json
            artifacts/index84-completion.md
            artifacts/rollout-evidence-packet.json
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # Gate 5: Provider ablation evidence artifact
  # Generates cost/latency/quality tradeoff report for release evidence.
  # -------------------------------------------------------------------------
  provider-ablation:
    name: Provider ablation report
    runs-on: ubuntu-latest
    needs: [api-tests]
    defaults:
      run:
        working-directory: services/api

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Generate provider ablation artifacts
        run: uv run python ../../packages/evals/run_provider_ablation.py

      - name: Upload provider ablation artifact
        uses: actions/upload-artifact@v4
        with:
          name: provider-ablation-report
          path: artifacts/provider-ablation.*
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # Gate 6: Retrieval benchmark + drift report
  # Validates retrieval relevance against fixtures and baseline thresholds.
  # -------------------------------------------------------------------------
  retrieval-benchmark:
    name: Retrieval benchmark report
    runs-on: ubuntu-latest
    needs: [api-tests]
    defaults:
      run:
        working-directory: services/api

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Generate retrieval benchmark artifacts
        run: uv run python ../../packages/evals/run_retrieval_benchmark.py

      - name: Upload retrieval benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-benchmark-report
          path: artifacts/retrieval-benchmark.*
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # Gate 7: Migration/versioning contract check
  # Enforces migration naming/version continuity and schema contract alignment.
  # -------------------------------------------------------------------------
  migration-check:
    name: Migration and schema versioning check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify migration/versioning contracts
        run: python scripts/verify-migrations.py

  # -------------------------------------------------------------------------
  # Gate 8: Scorecard runtime verification
  # Ensures /metrics, /scorecard, and /health/detailed are coherent and complete.
  # -------------------------------------------------------------------------
  scorecard-runtime:
    name: Scorecard runtime verification
    runs-on: ubuntu-latest
    needs: [api-tests]
    defaults:
      run:
        working-directory: services/api

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Verify scorecard runtime contracts
        run: uv run python ../../scripts/verify-scorecard-runtime.py

      - name: Upload scorecard runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: scorecard-runtime-report
          path: artifacts/scorecard-runtime.*
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # Gate 9: Milestone M1 readiness evidence
  # Produces a consolidated readiness artifact for migration/retrieval/scorecard.
  # -------------------------------------------------------------------------
  m1-readiness:
    name: Milestone M1 readiness report
    runs-on: ubuntu-latest
    needs: [migration-check, retrieval-benchmark, scorecard-runtime]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install API dependencies
        run: |
          cd services/api
          uv sync

      - name: Generate Milestone M1 readiness artifacts
        run: python scripts/generate-m1-readiness.py

      - name: Upload M1 readiness artifact
        uses: actions/upload-artifact@v4
        with:
          name: m1-readiness-report
          path: artifacts/m1-readiness.*
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # Gate 10: Scanner discovery benchmark
  # Validates scanner candidate discovery quality and provenance drift bounds.
  # -------------------------------------------------------------------------
  scanner-benchmark:
    name: Scanner benchmark report
    runs-on: ubuntu-latest
    needs: [api-tests]
    defaults:
      run:
        working-directory: services/api

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Generate scanner benchmark artifacts
        run: uv run python ../../packages/evals/run_scanner_benchmark.py

      - name: Upload scanner benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: scanner-benchmark-report
          path: artifacts/scanner-benchmark.*
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # Deploy to STAGING (branch: staging only)
  # Triggers after all gates pass. Uses Render deploy hooks stored as secrets.
  # -------------------------------------------------------------------------
  deploy-staging:
    name: Deploy → Staging
    runs-on: ubuntu-latest
    needs: [api-tests, web-build, stack-contract, visibility-proof, provider-ablation, retrieval-benchmark, migration-check, scorecard-runtime, m1-readiness, scanner-benchmark]
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'

    steps:
      - name: Trigger staging API deploy
        if: vars.RENDER_HOOK_STAGING_API != ''
        run: |
          curl -s -X POST "${{ vars.RENDER_HOOK_STAGING_API }}" \
            -H "Content-Type: application/json" \
            --fail-with-body
        continue-on-error: true

      - name: Trigger staging Web deploy
        if: vars.RENDER_HOOK_STAGING_WEB != ''
        run: |
          curl -s -X POST "${{ vars.RENDER_HOOK_STAGING_WEB }}" \
            -H "Content-Type: application/json" \
            --fail-with-body
        continue-on-error: true

      - name: Staging deploy triggered
        run: echo "Staging deploy hooks fired. Monitor at https://dashboard.render.com"

  # -------------------------------------------------------------------------
  # Deploy to PRODUCTION (branch: main only)
  # Only runs on main after all gates pass. Production deploys are gated by
  # the same CI suite + Render health checks before traffic cutover.
  # -------------------------------------------------------------------------
  deploy-production:
    name: Deploy → Production
    runs-on: ubuntu-latest
    needs: [api-tests, web-build, stack-contract, visibility-proof, provider-ablation, retrieval-benchmark, migration-check, scorecard-runtime, m1-readiness, scanner-benchmark]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger production API deploy
        if: vars.RENDER_HOOK_PROD_API != ''
        run: |
          curl -s -X POST "${{ vars.RENDER_HOOK_PROD_API }}" \
            -H "Content-Type: application/json" \
            --fail-with-body
        continue-on-error: true

      - name: Trigger production Web deploy
        if: vars.RENDER_HOOK_PROD_WEB != ''
        run: |
          curl -s -X POST "${{ vars.RENDER_HOOK_PROD_WEB }}" \
            -H "Content-Type: application/json" \
            --fail-with-body
        continue-on-error: true

      - name: Production deploy triggered
        run: echo "Production deploy hooks fired. Monitor at https://dashboard.render.com"
