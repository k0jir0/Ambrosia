name: Release CLI and SDK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  release:
    name: Build, sign, and package CLI/SDK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build Python distributions
        run: |
          python -m build packages/sdk-python
          python -m build packages/cli

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch CLI image
        id: docker_build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: packages/cli/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/ambrosia-cli:${{ github.ref_name }}

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign image with keyless Sigstore
        run: cosign sign --yes ghcr.io/${{ github.repository_owner }}/ambrosia-cli@${{ steps.docker_build.outputs.digest }}

      - name: Generate checksums
        run: sha256sum packages/sdk-python/dist/* packages/cli/dist/* > artifacts/release-checksums.sha256

      - name: Generate release evidence
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          CLI_IMAGE_REF: ghcr.io/${{ github.repository_owner }}/ambrosia-cli
          CLI_IMAGE_DIGEST: ${{ steps.docker_build.outputs.digest }}
          SIGNATURE_METHOD: sigstore-cosign-keyless
          SIGNED_ARTIFACTS: "true"
        run: python scripts/generate-release-evidence.py

      - name: Verify release readiness
        run: python scripts/verify-release-readiness.py

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-cli-sdk-artifacts
          path: |
            artifacts/release-checksums.sha256
            artifacts/release-evidence.json
            packages/sdk-python/dist/*
            packages/cli/dist/*
          if-no-files-found: error
