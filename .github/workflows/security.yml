name: Security

on:
  push:
    branches: [main, staging]
  pull_request:
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v3

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - run: python -m pip install pip-audit
      - run: pip-audit -r services/api/requirements.txt
      - run: pnpm audit --audit-level high

  index119-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/verify-index119-readiness.py
      - run: python scripts/verify-migrations.py

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ambrosia
          POSTGRES_USER: ambrosia
          POSTGRES_PASSWORD: integration-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ambrosia"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      INDEX119_TEST_DATABASE_URL: postgresql://ambrosia:integration-only@127.0.0.1:5432/ambrosia
      PYTHONPATH: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r services/api/requirements.txt pytest
      - run: PGPASSWORD=integration-only psql -h 127.0.0.1 -U ambrosia -d ambrosia -f infra/db/init.sql
      - run: python -m pytest services/api/tests/test_index119_postgres.py -q

  rust-hotpath:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path services/hotpath-rs/Cargo.toml --locked
