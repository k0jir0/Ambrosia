name: Synthetic Monitoring

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  synthetic-probes:
    name: Production synthetic probes
    runs-on: ubuntu-latest
    env:
      AMBROSIA_API_BASE_URL: ${{ vars.AMBROSIA_SYNTHETIC_API_BASE_URL }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Require an approved synthetic target
        run: test -n "$AMBROSIA_API_BASE_URL"

      - name: Run synthetic monitor probes (retry)
        continue-on-error: true
        run: |
          for attempt in 1 2 3; do
            echo "Synthetic monitor attempt ${attempt}/3"
            if python scripts/synthetic-monitor.py \
              --base-url "$AMBROSIA_API_BASE_URL" \
              --output-json artifacts/synthetic-monitor.json \
              --output-md artifacts/synthetic-monitor.md; then
              echo "Synthetic monitor probe run succeeded"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 30))
              echo "Probe run failed; retrying in ${delay}s"
              sleep "$delay"
            fi
          done
          echo "Synthetic monitor probe run failed after retries"
          exit 1

      - name: Evaluate synthetic monitoring regressions
        if: always()
        env:
          STRICT_MONITORING: ${{ vars.AMBROSIA_SYNTHETIC_STRICT == 'true' }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          report_path = Path('artifacts/synthetic-monitor.json')
          strict = os.getenv('STRICT_MONITORING', 'false').lower() == 'true'
          if not report_path.exists():
              print(f"Synthetic monitor artifact missing: {report_path}; strict_mode={strict}")
              sys.exit(1 if strict else 0)

          with report_path.open(encoding='utf-8') as f:
              data = json.load(f)

          failed = int(data.get('summary', {}).get('failed', 1))

          print(f"Synthetic monitor failures: {failed}; strict_mode={strict}")
          if failed == 0:
              sys.exit(0)

          if strict:
              print('Failing workflow because strict monitoring is enabled.')
              sys.exit(1)

          print('Non-strict scheduled run: preserving signal without failing workflow.')
          sys.exit(0)
          PY

      - name: Upload synthetic monitor artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synthetic-monitor-report
          path: artifacts/synthetic-monitor.*
          if-no-files-found: warn
