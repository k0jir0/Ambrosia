services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ambrosia
      POSTGRES_USER: ambrosia
      POSTGRES_PASSWORD: ${AMBROSIA_POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "5432:5432"
    volumes:
      - ambrosia_postgres:/var/lib/postgresql/data
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ambrosia -d ambrosia"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${AMBROSIA_REDIS_PASSWORD:-local-development-only}"]
    ports:
      - "6379:6379"
    volumes:
      - ambrosia_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${AMBROSIA_REDIS_PASSWORD:-local-development-only}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ambrosia_postgres:
  ambrosia_redis:
