[pytest]
# Pytest configuration for Index52 test suite

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Output
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -ra

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    deployment: marks tests as deployment validation
    smoke: marks tests as smoke tests
    critical: marks tests as critical path tests

# Timeout
timeout = 30

# Minimal verbosity for CI/CD
# Override with: pytest -v for verbose output
