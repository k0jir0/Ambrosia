services:
  - type: web
    name: ambrosia-trade-review-api
    runtime: python
    rootDir: services/api
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: ALLOWED_ORIGIN_REGEX
        value: https://.*\.onrender\.com

  - type: web
    name: ambrosia-trade-review-web
    runtime: node
    rootDir: .
    plan: free
    buildCommand: corepack enable && corepack prepare pnpm@9.12.0 --activate && pnpm install --frozen-lockfile && pnpm build:web
    startCommand: node index.js
    envVars:
      - key: NODE_VERSION
        value: 20.18.1
