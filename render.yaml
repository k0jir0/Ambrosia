# Ambrosia Render Deployment Configuration
#
# Branch → Environment mapping:
#   main    → production  (ambrosia-trade-review-api, ambrosia-trade-review-web)
#   staging → staging     (ambrosia-trade-review-api-staging, ambrosia-trade-review-web-staging)
#
# Development branches (feat/*, fix/*, chore/*) do NOT deploy to Render.
# They are developed locally and merged to staging via PR.
#
# Zero-Downtime Strategy:
#   - Health check (/health) must pass before traffic is routed to new instance
#   - Old instance drains in-flight requests during shutdown (30s grace)
#   - Rolling restart: new instance up before old one stops
#   - Failure threshold: 3 consecutive failures → auto-restart
#
# Deploy Hooks (store as GitHub Secrets, never commit):
#   RENDER_HOOK_PROD_API    - trigger production API deploy
#   RENDER_HOOK_PROD_WEB    - trigger production Web deploy
#   RENDER_HOOK_STAGING_API - trigger staging API deploy
#   RENDER_HOOK_STAGING_WEB - trigger staging Web deploy
#
# Get hooks from: Render Dashboard → Service → Settings → Deploy Hooks

services:

  # ============================================================
  # PRODUCTION SERVICES (branch: main)
  # ============================================================

  - type: web
    name: ambrosia-trade-review-api
    runtime: python
    rootDir: services/api
    branch: main
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --timeout-grace-period 30 --timeout-keep-alive 30
    healthCheckPath: /health
    healthCheckStartFailureThreshold: 10
    preDeployCommand: python scripts/validate-schema.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: warning
      - key: ALLOWED_ORIGIN_REGEX
        value: https://ambrosia-5aec\.onrender\.com

  - type: web
    name: ambrosia-trade-review-web
    runtime: node
    rootDir: .
    branch: main
    plan: free
    buildCommand: corepack prepare pnpm@9.12.0 --activate && pnpm install --frozen-lockfile --force && pnpm build:web
    startCommand: node index.js
    envVars:
      - key: NODE_VERSION
        value: 20.18.1
      - key: NEXT_PUBLIC_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://ambrosia-trade-review-api.onrender.com

  # ============================================================
  # STAGING SERVICES (branch: staging)
  # ============================================================

  - type: web
    name: ambrosia-trade-review-api-staging
    runtime: python
    rootDir: services/api
    branch: staging
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --timeout-grace-period 30 --timeout-keep-alive 30
    healthCheckPath: /health
    healthCheckStartFailureThreshold: 10
    preDeployCommand: python scripts/validate-schema.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: ENVIRONMENT
        value: staging
      - key: LOG_LEVEL
        value: info
      - key: ALLOWED_ORIGIN_REGEX
        value: https://.*-staging\.onrender\.com

  - type: web
    name: ambrosia-trade-review-web-staging
    runtime: node
    rootDir: .
    branch: staging
    plan: free
    buildCommand: corepack prepare pnpm@9.12.0 --activate && pnpm install --frozen-lockfile --force && pnpm build:web
    startCommand: node index.js
    envVars:
      - key: NODE_VERSION
        value: 20.18.1
      - key: NEXT_PUBLIC_ENV
        value: staging
      - key: NEXT_PUBLIC_API_URL
        value: https://ambrosia-trade-review-api-staging.onrender.com
