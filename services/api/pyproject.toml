[project]
name = "ambrosia-api"
version = "0.1.0"
description = "FastAPI service for Ambrosia Trade Review MVP"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.6",
  "uvicorn[standard]>=0.34.0",
  "pydantic>=2.10.3",
  "pydantic-settings>=2.6.1",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2.3",
  "python-dotenv>=1.0.1"
]

[dependency-groups]
dev = [
  "pytest>=8.3.4",
  "ruff>=0.8.3",
  "httpx>=0.28.1"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]