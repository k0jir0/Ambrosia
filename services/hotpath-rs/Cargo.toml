[package]
name = "ambrosia-hotpath"
version = "0.1.0"
edition = "2021"
description = "Deterministic low-latency hot path for order risk checks and kill-switch handling"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
